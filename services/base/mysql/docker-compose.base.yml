services:
  mysql:
    image: mysql:${DB_VER:?DB_VER is required}
    hostname: mysql.${STACK_DOMAIN:?STACK_DOMAIN is required}.local
    restart: ${RESTART:-unless-stopped}
    pull_policy: ${PULL_POLICY:-missing}

    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password

    secrets:
      - db_password
      - db_root_password

    configs:
      - source: mysql_tuning
        target: /etc/mysql/conf.d/tuning.cnf

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$(cat /run/secrets/db_root_password)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "${MYSQL_CPU_LIMIT:-1.0}"
          memory: ${MYSQL_MEM_LIMIT:-1G}

secrets:
  db_password:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/env/${COMPOSE_PROJECT_NAME}/db_password
  db_root_password:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/env/${COMPOSE_PROJECT_NAME}/db_root_password

configs:
  mysql_tuning:
    content: |
      [mysqld]
      innodb_buffer_pool_size = ${MYSQL_BUFFER_POOL:-256M}
      max_connections = ${MYSQL_MAX_CONNECTIONS:-100}
      slow_query_log = 1
      long_query_time = 2

volumes:
  mysql_data:
    labels:
      - pro.asemo.description=MySQL data directory for ${COMPOSE_PROJECT_NAME}
      - pro.asemo.service=mysql
