include:
  - ../backup/docker-compose.yml

x-volumes: &redis-volumes
  volumes:
    - redis_data:/srv/backup/redis

services:
  backup: *redis-volumes
  restore: *redis-volumes

  redis:
    image: redis:${REDIS_VER:-alpine}
    hostname: redis.${STACK_DOMAIN:?STACK_DOMAIN is required}.local
    restart: unless-stopped
    pull_policy: missing

    command: >
      sh -c '
      if [ -f /run/secrets/redis_password ]; then
        redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'

    secrets:
      - redis_password

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli --pass \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          memory: ${REDIS_MEM_LIMIT:-256M}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - homepage.group=${COMPOSE_PROJECT_NAME}
      - homepage.name=Redis
      - homepage.icon=redis.png
      - homepage.description=In-memory cache/data store for ${COMPOSE_PROJECT_NAME}

secrets:
  redis_password:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/env/${COMPOSE_PROJECT_NAME}/redis_password

volumes:
  redis_data:
