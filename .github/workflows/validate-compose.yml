name: Validate compose files

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Docker Compose v5.5.1
        # ubuntu-latest's bundled Compose (2.38.2) treats two included files
        # that both define the same service name as a hard error
        # ("services.<name> conflicts with imported resource"), even though
        # every generated docker-compose.yml here relies on exactly that
        # merging (base + backup + extension layers, all same service name)
        # - this fails on literally every file, always has. Compose 5.5.1
        # merges them correctly; install it explicitly rather than trusting
        # whatever the runner happens to bundle.
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -sL "https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64" \
            -o ~/.docker/cli-plugins/docker-compose
          echo "db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      - name: Generate dummy env for required variables
        run: |
          grep -rhoP '(?<=\$\{)[A-Za-z_][A-Za-z0-9_]*(?=:\?)' templates example_app \
            | sort -u > /tmp/required-vars.txt
          : > ci.env
          while read -r var; do
            # SECRETS_DIR is concatenated into bind-mount source paths
            # (${SECRETS_DIR}/keys/...) - it must look like an absolute
            # path, or compose's short volume syntax mistakes the result
            # for a *named* volume reference instead of a bind mount.
            if [ "$var" = "SECRETS_DIR" ]; then
              echo "SECRETS_DIR=/ci-dummy/secrets" >> ci.env
            else
              echo "${var}=ci-dummy-value" >> ci.env
            fi
          done < /tmp/required-vars.txt
          cat ci.env

      - name: Validate every stack and example_app compose file
        run: |
          status=0
          for f in templates/stacks/*.yml example_app/*/docker-compose.yml; do
            echo "== $f =="
            docker compose --env-file "$PWD/ci.env" -f "$f" config -q || status=1
          done
          exit $status
