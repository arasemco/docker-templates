name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group test --group dev

      - name: Run tests
        run: uv run pytest -q --cov --cov-report=term-missing
