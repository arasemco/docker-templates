# Copy .env.example to .env and fill it in, then create the postgres
# password secret it points at:
#   mkdir -p "$SECRETS_DIR/env/$COMPOSE_PROJECT_NAME"
#   head -c 512 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32 \
#     > "$SECRETS_DIR/env/$COMPOSE_PROJECT_NAME/postgres_password"
#
# Metabase joins the reverse proxy's network and also publishes its UI on
# METABASE_PORT on the host. A database Metabase should query (added in its
# UI) must be reachable from here too: attach its network below, or reach
# it through a published port.

include:
  - ../../templates/stacks/docker-compose.metabase-postgres.yml

services:
  metabase:
    ports:
      - "${METABASE_PORT:-3072}:3000"
    networks:
      - frontend

networks:
  frontend:
    name: domain_reverse-proxy
    external: true
