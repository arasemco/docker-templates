include:
  - ../../templates/stacks/docker-compose.passbolt-mariadb.yml

services:
  passbolt:
    configs:
      - source: nginx_realip
        target: /etc/nginx/conf.d/real-ip.conf

    networks:
      - reverse-proxy

configs:
  nginx_realip:
    content: |
      set_real_ip_from 10.2.0.2;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;

networks:
  reverse-proxy:
    name: domain_reverse-proxy
    external: true
