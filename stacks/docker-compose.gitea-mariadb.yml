# Composed template: Gitea + MariaDB.
# Wires base/gitea and base/mariadb together on shared networks with a
# health-gated startup order. Include this single file from a stack's
# docker-compose.yml; it needs no other includes alongside it.
#
# In the stack's .env:
#   DB_HOST=mariadb.${STACK_DOMAIN}.local
# to match the hostname mariadb's base file gives its service.

include:
  - path:
      - ../services/base/gitea/docker-compose.yml
      - ../services/base/gitea/docker-compose.smtp.yml
      - ../services/base/gitea/database/docker-compose.mariadb.yml
  - ../services/base/mariadb/docker-compose.yml

services:
  gitea:
    networks:
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true

  gitea-cli:
    networks:
      - backend

  gitea-init:
    extends:
      service: gitea-cli

  mariadb:
    networks:
      - backend

networks:
  backend:
    internal: true
