# Composed template: Nginx Proxy Manager + MariaDB.
# Wires base/nginx-proxy-manager and base/mariadb together on shared
# networks with a health-gated startup order. Include this single file
# from a stack's docker-compose.yml; it needs no other includes alongside
# it.
#
# In the stack's .env:
#   DB_HOST=mariadb.${STACK_DOMAIN}.local
# to match the hostname mariadb's base file gives its service.

include:
  - ../services/base/nginx-proxy-manager/docker-compose.yml
  - ../services/base/mariadb/docker-compose.yml

services:
  npm:
    environment:
      DB_MYSQL_HOST: ${DB_HOST:?DB_HOST is required - set to the included database service's hostname}
      DB_MYSQL_PORT: ${DB_PORT:-3306}
      DB_MYSQL_USER: ${DB_USER:?DB_USER is required}
      DB_MYSQL_PASSWORD__FILE: /run/secrets/db_password
      DB_MYSQL_NAME: ${DB_NAME:?DB_NAME is required}
    secrets:
      - db_password
    networks:
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true

  mariadb:
    networks:
      - backend

networks:
  backend:
    internal: true
