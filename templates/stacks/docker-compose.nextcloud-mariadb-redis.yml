  - ../services/base/mariadb/docker-compose.yml
  - ../services/base/redis/docker-compose.yml

services:
  nextcloud:
    profiles:
      - frontend
    networks:
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true

  nextcloud-cron:
    networks:
      - backend
    depends_on:
      nextcloud:
        condition: service_healthy
        restart: true

  mariadb:
    profiles:
      - backend
    networks:
      - backend

  redis:
    profiles:
      - backend
    networks:
      - backend

networks:
  backend:
    internal: true
