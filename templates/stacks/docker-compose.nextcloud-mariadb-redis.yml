# Composed template: Nextcloud + MariaDB + Redis.
# Wires base/nextcloud, base/mariadb and base/redis together on shared
# networks with a health-gated startup order, selects nextcloud's redis
# cache and smtp mailer variants, and adds nextcloud-cron for background
# jobs (set `occ background:cron` once after install). Include this single
# file from a stack's docker-compose.yml; it needs no other includes
# alongside it.

include:
  - path:
      - ../services/base/nextcloud/docker-compose.yml
      - ../services/base/nextcloud/database/docker-compose.mariadb.yml
      - ../services/base/nextcloud/cache/docker-compose.redis.yml
      - ../services/base/nextcloud/mailer/docker-compose.smtp.yml
