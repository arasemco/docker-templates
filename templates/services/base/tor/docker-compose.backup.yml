include:
  - ../backup/docker-compose.yml

x-volumes: &tor-volumes
  volumes:
    - tor_etc:/mnt/etc/tor
    - tor_var:/mnt/var/lib/tor

services:
  backup: *tor-volumes
  restore:
    <<: *tor-volumes
    configs:
      - source: tor_restore_00_owner
        target: /srv/configs/restore.d/00-tor-owner.sh

configs:
  tor_restore_00_owner:
    content: |
      set -e
      chown -R 101:101 /mnt/etc/tor
      find /mnt/etc/tor -type d -exec chmod 700 {} +
      find /mnt/etc/tor -type f -exec chmod 600 {} +

      chown -R 101:101 /mnt/var/lib/tor
      find /mnt/var/lib/tor -type d -exec chmod 700 {} +
      find /mnt/var/lib/tor -type f -exec chmod 600 {} +
