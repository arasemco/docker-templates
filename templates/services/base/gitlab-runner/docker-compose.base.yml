# Auto-generated from templates/specs/services/gitlab-runner.yaml — do not edit directly.
# Edit the spec and regenerate; see tools/README.md.

services:
  gitlab-runner:
    image: gitlab/gitlab-runner:${GITLAB_RUNNER_TAG:?GITLAB_RUNNER_TAG is required}
    hostname: gitlab-runner.${STACK_DOMAIN:?STACK_DOMAIN is required}.local
    restart: ${RESTART:-unless-stopped}
    pull_policy: ${PULL_POLICY:-missing}

    command: |
      sh -c '
      set -e
      if ! grep -q "^\[\[runners\]\]" /etc/gitlab-runner/config.toml 2>/dev/null; then
        gitlab-runner register --non-interactive \
          --url "https://${STACK_DOMAIN}" \
          --token "$$(cat /run/secrets/gitlab-runner_token)" \
          --executor docker \
          --docker-image "${GITLAB_RUNNER_DOCKER_IMAGE:-alpine:latest}" \
          --docker-volumes /var/run/docker.sock:/var/run/docker.sock \
          --description "gitlab-runner-${HOSTNAME:-local}"
      fi
      exec gitlab-runner run'

    secrets:
      - gitlab-runner_token

    volumes:
      - type: volume
        source: gitlab-runner_config
        target: /etc/gitlab-runner
        read_only: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: false

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'gitlab-runner run' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "${GITLAB_RUNNER_CPU_LIMIT:-0.5}"
          memory: ${GITLAB_RUNNER_MEM_LIMIT:-512M}

    profiles:
      - ''
      - gitlab-runner
      - ci

    labels:
      - homepage.group=${COMPOSE_PROJECT_NAME}
      - homepage.name=GitLab Runner
      - homepage.icon=gitlab.png
      - homepage.description=CI runner for GitLab

secrets:
  gitlab-runner_token:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/env/${COMPOSE_PROJECT_NAME}/gitlab-runner_token

volumes:
  gitlab-runner_config:
    labels:
      - pro.asemo.description=GitLab Runner config directory for ${COMPOSE_PROJECT_NAME}
      - pro.asemo.service=gitlab-runner
