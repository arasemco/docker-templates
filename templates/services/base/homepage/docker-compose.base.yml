# Auto-generated from templates/specs/services/homepage.yaml — do not edit directly.
# Edit the spec and regenerate; see tools/README.md.

services:
  homepage:
    image: docker.io/gethomepage/homepage:${HOMEPAGE_TAG:-v2.4.0}
    hostname: homepage.${STACK_DOMAIN:?STACK_DOMAIN is required}.local
    restart: ${RESTART:-unless-stopped}
    pull_policy: ${PULL_POLICY:-missing}

    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${STACK_DOMAIN}
      HOMEPAGE_EXTERNAL_URL: https://${STACK_DOMAIN}
      LOG_TARGETS: ${HOMEPAGE_LOG_TARGETS:-stdout}
      LOG_LEVEL: ${HOMEPAGE_LOG_LEVEL:-info}

    configs:
      - source: homepage_settings
        target: /app/config/settings.yaml
      - source: homepage_services
        target: /app/config/services.yaml
      - source: homepage_bookmarks
        target: /app/config/bookmarks.yaml
      - source: homepage_widgets
        target: /app/config/widgets.yaml

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "${HOMEPAGE_CPU_LIMIT:-0.5}"
          memory: ${HOMEPAGE_MEM_LIMIT:-256M}

    profiles:
      - ''
      - homepage
      - dashboard

    labels:
      - homepage.group=${COMPOSE_PROJECT_NAME}
      - homepage.name=Homepage
      - homepage.icon=homepage.png
      - homepage.description=Self-hosted dashboard
      - homepage.href=https://${STACK_DOMAIN}

configs:
  homepage_settings:
    content: |
      []

  homepage_services:
    content: |
      []

  homepage_bookmarks:
    content: |
      []

  homepage_widgets:
    content: |
      []
