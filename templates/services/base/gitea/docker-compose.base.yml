      GITEA__security__INTERNAL_TOKEN_URI: file:/run/secrets/security_internal_token
      GITEA__security__MIN_PASSWORD_LENGTH: 32
      GITEA__security__PASSWORD_CHECK_PWN: false
      GITEA__security__PASSWORD_HASH_ALGO: pbkdf2
      GITEA__security__PASSWORD_COMPLEXITY: lower,upper,digit,spec
