      - type: bind
        source: ${SECRETS_DIR:?SECRETS_DIR is required}/keys/${COMPOSE_PROJECT_NAME}/gpg
        target: /data/gitea/home/.gnupg
        read_only: false

    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s -o /dev/null http://localhost:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "${GITEA_CPU_LIMIT:-1.0}"
          memory: ${GITEA_MEM_LIMIT:-512M}

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    profiles:
      - ''
      - gitea
      - git

    labels:
      - homepage.group=${COMPOSE_PROJECT_NAME}
      - homepage.name=Gitea
      - homepage.icon=gitea.png
      - homepage.description=Self-hosted Git service
      - homepage.ping=https://${STACK_DOMAIN}
      - homepage.href=https://${STACK_DOMAIN}
      - homepage.widget.type=gitea
      - homepage.widget.url=http://gitea:3000
      - homepage.widget.key=${GITEA_HOMEPAGE_API_KEY}
      - homepage.widget.fields=["repositories", "notifications", "issues", "pulls"]
      - npm.proxy.host.details.domain_names=["${STACK_DOMAIN}"]
      - npm.proxy.host.details.scheme=http
      - npm.proxy.host.details.forward.host=gitea
      - npm.proxy.host.details.forward.port=3000
      - npm.proxy.host.details.access_list=HomeIP
      - npm.proxy.host.details.options.cache_assets=false
      - npm.proxy.host.details.options.block_common_exploits=true
      - npm.proxy.host.details.options.websockets_support=true
      - npm.proxy.host.advanced=real_ip_header CF-Connecting-IP;
      - npm.proxy.host.custom_locations.location=/test
      - npm.proxy.host.custom_locations.scheme=http
      - npm.proxy.host.custom_locations.forwardhost=tset
      - npm.proxy.host.custom_locations.forwardport=3001
      - npm.proxy.host.custom_locations.advanced=some custom nginx conf
      - npm.proxy.host.ssl.certificate=*.asemo.pro, asemo.pro
      - npm.proxy.host.ssl.force=true
      - npm.proxy.host.ssl.http2_support=true
      - npm.proxy.host.ssl.hsts_enabled=true
      - npm.proxy.host.ssl.hsts_sub-domains=false
      - npm.proxy.host.ssl.advanced.trust_upstream_forwarded_proto_headers=false

secrets:
  security_secret_key:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/env/${COMPOSE_PROJECT_NAME}/security_secret_key
  security_internal_token:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/env/${COMPOSE_PROJECT_NAME}/security_internal_token
  server_lfs_jwt_secret:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/env/${COMPOSE_PROJECT_NAME}/server_lfs_jwt_secret
  oauth2_jwt_secret:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/env/${COMPOSE_PROJECT_NAME}/oauth2_jwt_secret

volumes:
  gitea_data:
    labels:
      - pro.asemo.description=Gitea data directory for ${COMPOSE_PROJECT_NAME}
