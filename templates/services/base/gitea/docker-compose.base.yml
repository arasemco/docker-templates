      GITEA__repository__DISABLE_HTTP_GIT: ${GITEA_DISABLE_HTTP_GIT:-false}
      GITEA__repository__PREFERRED_LICENSES: ${GITEA_PREFERRED_LICENSES:-Apache License 2.0,MIT License}
      GITEA__repository__DEFAULT_BRANCH: ${GITEA_DEFAULT_BRANCH:-main}
      GITEA__repository__DEFAULT_PUSH_CREATE_PRIVATE: ${GITEA_DEFAULT_PUSH_CREATE_PRIVATE:-true}
      GITEA__repository__ENABLE_PUSH_CREATE_ORG: ${GITEA_ENABLE_PUSH_CREATE_ORG:-true}
      GITEA__repository__ENABLE_PUSH_CREATE_USER: ${GITEA_ENABLE_PUSH_CREATE_USER:-true}
      GITEA__repository.signing__INITIAL_COMMIT: ${GITEA_SIGNING_INITIAL_COMMIT:-always}
