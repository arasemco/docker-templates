# Auto-generated from templates/specs/services/mariadb.yaml — do not edit directly.
# Edit the spec and regenerate; see tools/README.md.

services:
  mariadb:
    image: mariadb:${MARIADB_TAG:?MARIADB_TAG is required}
    hostname: mariadb.${STACK_DOMAIN:?STACK_DOMAIN is required}.local
    restart: ${RESTART:-unless-stopped}
    pull_policy: ${PULL_POLICY:-missing}

    environment:
      MARIADB_DATABASE: ${MARIADB_NAME:?MARIADB_NAME is required}
      MARIADB_USER: ${MARIADB_USER:?MARIADB_USER is required}
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password

    secrets:
      - mariadb_password
      - mariadb_root_password

    configs:
      - source: mariadb_tuning
        target: /etc/mysql/conf.d/tuning.cnf

    volumes:
      - type: volume
        source: mariadb_data
        target: /var/lib/mysql
        read_only: false

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "${MARIADB_CPU_LIMIT:-1.0}"
          memory: ${MARIADB_MEM_LIMIT:-1G}

    labels:
      - homepage.group=${COMPOSE_PROJECT_NAME}
      - homepage.name=MariaDB
      - homepage.icon=mariadb.png
      - homepage.description=Relational database for ${COMPOSE_PROJECT_NAME}

secrets:
  mariadb_password:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/env/${COMPOSE_PROJECT_NAME}/mariadb_password
  mariadb_root_password:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/env/${COMPOSE_PROJECT_NAME}/mariadb_root_password

configs:
  mariadb_tuning:
    content: |
      [mysqld]
      innodb_buffer_pool_size = ${MARIADB_BUFFER_POOL:-256M}
      max_connections = ${MARIADB_MAX_CONNECTIONS:-100}
      slow_query_log = 1
      long_query_time = 2

volumes:
  mariadb_data:
    labels:
      - pro.asemo.description=MariaDB data directory for ${COMPOSE_PROJECT_NAME}
      - pro.asemo.service=mariadb
