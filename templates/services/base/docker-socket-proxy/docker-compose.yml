# .github/) and it ships no logo of its own, only shields.io badges, so
# there's no project-specific asset to point at. Docker's logo is still
# the accurate choice, not a generic placeholder: this proxies the Docker
# API specifically. Served straight from docker.com's own favicon asset,
# not a third-party mirror.

