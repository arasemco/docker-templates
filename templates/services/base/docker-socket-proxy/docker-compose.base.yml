services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:${DOCKER_SOCKET_PROXY_TAG:?DOCKER_SOCKET_PROXY_TAG is required}
    hostname: docker-socket-proxy.${STACK_DOMAIN:?STACK_DOMAIN is required}.local
    restart: ${RESTART:-unless-stopped}
    pull_policy: ${PULL_POLICY:-missing}

    environment:
      CONTAINERS: "1"

    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/containers/json"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "${DOCKER_SOCKET_PROXY_CPU_LIMIT:-0.5}"
          memory: ${DOCKER_SOCKET_PROXY_MEM_LIMIT:-256M}

    profiles:
      - ''
      - docker-socket-proxy
      - docker-proxy

    labels:
      - homepage.group=${COMPOSE_PROJECT_NAME}
      - homepage.name=Docker Socket Proxy
      - homepage.icon=https://www.docker.com/app/uploads/2024/02/cropped-docker-logo-favicon-192x192.png
      - homepage.description=Scoped read-only proxy for the Docker API

