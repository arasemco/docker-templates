app: passbolt
dep: mariadb

extensions:
  database: mariadb
  mailer: smtp

custom: false

app_extra:
  profiles:
    - frontend

dep_extra:
  profiles:
    - backend

header_comment: |
  Composed template: Passbolt + MariaDB.
  Wires base/passbolt and base/mariadb together on shared networks with a
  health-gated startup order, and selects passbolt's smtp mailer variant —
  registration/invite emails are core to passbolt, so this stack always
  wires mail rather than leaving it as a manual add-on; requires
  SMTP_HOST/SMTP_FROM and a shared smtp_password secret (see
  passbolt.yaml's mailer extension) to actually be set. Include this
  single file from a stack's docker-compose.yml; it needs no other
  includes alongside it.
