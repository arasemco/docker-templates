app: passbolt
dep: mariadb

extensions:
  database: mariadb

custom: true

extra_services:
  - passbolt-cli
  - name: passbolt-init
    networks: []
    extends: passbolt-cli

header_comment: |
  Composed template: Passbolt + MariaDB.
  Wires base/passbolt and base/mariadb together on shared networks with a
  health-gated startup order. Include this single file from a stack's
  docker-compose.yml; it needs no other includes alongside it.
