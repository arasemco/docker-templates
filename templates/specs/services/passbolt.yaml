image: passbolt/passbolt
tag_required: true

environment:
  APP_FULL_BASE_URL: "https://${STACK_DOMAIN}"
  PASSBOLT_SSL_FORCE: "-ssl_force:true"
  PASSBOLT_REGISTRATION_PUBLIC: "-registration_public:false"
  PASSBOLT_GPG_SERVER_KEY_:
    FINGERPRINT: "?gpg_fingerprint"
    PUBLIC: /etc/passbolt/gpg/serverkey.asc
    PRIVATE: /etc/passbolt/gpg/serverkey_private.asc

volumes:
  images:
    path: /usr/share/php/passbolt/webroot/img/public
  jwt:
    path: /etc/passbolt/jwt
    backup: true
    owner:
      uid: 33
      gid: 33

bind_mounts:
  - source: "${SECRETS_DIR:?SECRETS_DIR is required}/keys/${COMPOSE_PROJECT_NAME}/gpg"
    target: /etc/passbolt/gpg
    backup: true
    owner:
      uid: 33
      gid: 33

healthcheck:
  test: ["CMD", "/usr/bin/curl", "-fk", "https://localhost/healthcheck/status"]

cpu_default: "1.0"
mem_default: "512M"

extra:
  profiles:
    - ""
    - passbolt
    - password-manager

labels:
  homepage.:
    description: "Self-hosted password manager"
    ping: "https://${STACK_DOMAIN}"
    href: "https://${STACK_DOMAIN}"

extensions:
  database:
    variants:
      mariadb:
        environment:
          DATASOURCES_DEFAULT_:
            HOST: "-host:mariadb:3306"
            DATABASE: "?name"
            USERNAME: "?user"
        secrets:
          - name: password
            env_var: DATASOURCES_DEFAULT_PASSWORD_FILE
  mailer:
    variants:
      smtp:
        environment:
          EMAIL_:
            TRANSPORT_DEFAULT_:
              HOST: "?host"
              PORT: "-port:587"
              TLS: "-tls:true"
              USERNAME: "-user:"
            DEFAULT_FROM: "?from"
        secrets:
          - name: password
            env_var: EMAIL_TRANSPORT_DEFAULT_PASSWORD_FILE
            shared: true

header_comment: |
  Passbolt — self-hosted password manager.
  Needs its GPG server key pair placed under the shared secrets dir before
  first boot (see PASSBOLT_GPG_SERVER_KEY_FINGERPRINT); the database and
  mailer extensions are optional add-ons, picked by the consuming stack —
  mailer is grouped/variant-shaped like database (currently one variant,
  smtp) so a non-SMTP transport can be added later without reshaping this.
  In practice passbolt is not very usable without mail (registration/
  invite flows depend on it), so most real stacks will want it wired in.
