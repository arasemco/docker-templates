image: gitlab/gitlab-ce
tag_required: true

service:
  name: gitlab

display:
  name: GitLab

environment:
  GITLAB_OMNIBUS_CONFIG: |
    external_url 'https://${STACK_DOMAIN}'
    # This is gitlab-shell's own internal SSH port, embedded verbatim into
    # every clone URL GitLab generates — if the consuming docker-compose.yml
    # publishes a non-standard host port for SSH (e.g. 2222->22), set
    # GITLAB_SSH_PORT to that EXTERNAL port instead, not the container-side
    # one, or generated clone URLs will point at the wrong port.
    gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-22}

    # Homelab-scale resource tuning — the omnibus defaults target a much
    # larger multi-user instance than a single-node personal deployment
    # needs; these are the knobs GitLab's own docs call out for a
    # memory-constrained environment.
    puma['worker_processes'] = ${GITLAB_PUMA_WORKERS:-2}
    sidekiq['concurrency'] = ${GITLAB_SIDEKIQ_CONCURRENCY:-10}
    prometheus_monitoring['enable'] = false
    grafana['enable'] = false

    # Registry and Pages are separate features with their own
    # ports/storage/subdomains — deployment-specific, left disabled here
    # rather than half-configured; same convention as this repo's
    # adguard-home/haproxy/squid specs punting deployment-specific
    # networking to the consuming docker-compose.yml.
    registry['enable'] = false
    gitlab_pages['enable'] = false

    # Outbound mail — off unless the consuming stack sets SMTP_ENABLED and
    # the other SMTP_* vars; smtp_password reads the mailer extension's
    # shared secret only if that extension is actually selected (the file
    # check keeps this safe to run standalone, without the extension, too).
    gitlab_rails['smtp_enable'] = ${SMTP_ENABLED:-false}
    gitlab_rails['smtp_address'] = "${SMTP_HOST:-}"
    gitlab_rails['smtp_port'] = ${SMTP_PORT:-587}
    gitlab_rails['smtp_domain'] = "${STACK_DOMAIN}"
    gitlab_rails['smtp_user_name'] = "${SMTP_USERNAME:-}"
    gitlab_rails['smtp_password'] = File.exist?('/run/secrets/smtp_password') ? File.read('/run/secrets/smtp_password').strip : nil
    gitlab_rails['smtp_authentication'] = "login"
    gitlab_rails['smtp_enable_starttls_auto'] = ${SMTP_TLS:-true}
    gitlab_rails['gitlab_email_from'] = "${SMTP_FROM:-}"
    gitlab_rails['gitlab_email_reply_to'] = "${SMTP_FROM:-}"

volumes:
  config:
    path: /etc/gitlab
    backup: true
  data:
    path: /var/opt/gitlab
    backup: true
  logs:
    path: /var/log/gitlab

healthcheck:
  test: ["CMD", "curl", "--fail", "-s", "-o", "/dev/null", "http://localhost/-/readiness"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 300s

cpu_default: "4.0"
mem_default: "4G"

extra:
  profiles:
    - ""
    - gitlab
    - git

labels:
  homepage.:
    description: "Self-hosted Git service (GitLab)"
    ping: "https://${STACK_DOMAIN}"
    href: "https://${STACK_DOMAIN}"
    widget.:
      type: gitlab
      url: "http://gitlab:80"
      key: "${GITLAB_HOMEPAGE_API_KEY}"
      user_id: "${GITLAB_HOMEPAGE_USER_ID}"
      fields: '["events", "issues", "merges", "projects"]'

extensions:
  mailer:
    variants:
      smtp:
        shared: true
        secrets:
          - name: password

header_comment: |
  GitLab (Community Edition) — self-hosted Git service with CI/CD, issues,
  container registry (disabled by default here) and more. Uses the
  official omnibus image, which bundles its own PostgreSQL, Redis, and
  Nginx inside the one container — unlike gitea/passbolt, there is
  deliberately NO `database` extension here: GitLab only ever speaks
  PostgreSQL (no MariaDB/MySQL support at all), and this repo has no
  `postgres` base service yet to wire externally. Add one and an
  extension later if an external Postgres is ever actually needed.

  Nearly everything is configured through the single GITLAB_OMNIBUS_CONFIG
  env var (a Ruby/Chef attributes block — the image's sole configuration
  interface), not discrete per-field env vars. That's also why the
  `mailer` extension here looks different from gitea/passbolt's: it only
  mounts the shared `smtp_password` secret (same
  env/000-generic/smtp/password file they already use) — the actual
  SMTP_HOST/PORT/FROM/etc. directives live inline in the base config above
  as soft `${VAR:-}` defaults, since they can't be merged additively into
  a separate environment dict the way gitea/passbolt's discrete SMTP_*
  fields can. Mail stays off (smtp_enable defaults false) whether or not
  the mailer extension is selected; selecting it only makes the secret
  file available for smtp_password to actually read.

  No `owner:` set on the config/data volumes — the omnibus entrypoint
  manages its own internal uid/gid via `gitlab-ctl reconfigure` on first
  boot; guessing a uid here risks the restore script chowning files to the
  wrong owner (see tools/.claude/skills/scaffold-service's warning on this
  exact point). `logs` is intentionally not backed up (regenerable).

  cpu_default/mem_default (4.0/4G) reflect a realistic single-node
  homelab baseline, not GitLab's own docs: they cite ~1 core/2GB as the
  degraded-performance floor and 4 cores as the recommended minimum for
  up to ~500 users — raise via GITLAB_CPU_LIMIT/GITLAB_MEM_LIMIT for real
  usage. First boot commonly takes several minutes (the reconfigure run),
  hence the 300s healthcheck start_period — likely still needs raising
  further on slow storage.

  Ports (80/443/22) are deployment-specific, same convention as
  haproxy/squid/adguard-home — publish or reverse-proxy them in the
  consuming docker-compose.yml, not here.
