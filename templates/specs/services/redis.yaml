image: redis
tag_default: alpine

command: |
  sh -c '
  if [ -f /run/secrets/redis_password ]; then
    redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes;
  else
    redis-server --appendonly yes;
  fi'

secrets:
  - name: password

volumes:
  data:
    path: /data
    backup: true
    owner:
      uid: 999
      gid: 999

healthcheck:
  test: ["CMD-SHELL", "redis-cli --pass \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]

cpu_default: "0.5"
mem_default: "256M"

labels:
  homepage.:
    description: "In-memory cache/data store for ${COMPOSE_PROJECT_NAME}"

header_comment: |
  Redis — in-memory cache/data store.
  Runs unauthenticated if no `password` secret is provided; append-only
  persistence is always on.
