image: ghcr.io/arasemco/dsh
description: DeepSeek coding agent web UI
tag_default: latest

display:
  name: DeepSeek Harness

environment:
  DSH_PORT: "-port:3080"

volumes:
  home:
    path: /home/dsh/.dsh
    backup: true
    owner:
      uid: 1000
      gid: 1000

cpu_default: "4"
mem_default: "8G"

labels:
  homepage.:
    icon: deepseek.svg
    description: "DeepSeek coding agent for ${COMPOSE_PROJECT_NAME}"
    ping: "http://127.0.0.1:3080/"
    href: "http://127.0.0.1:3080/"

extra:
  init: true

header_comment: |
  DeepSeek Harness (dsh) — DeepSeek coding agent with a web UI, built
  locally from ~/Projects/docker/deepseek-harness (`bash bake.sh`).
  Listens on 0.0.0.0:3080 via the `listen` config (a --patch overlay; the
  --host flag refuses 0.0.0.0) so a reverse proxy can reach it, and trusts
  STACK_DOMAIN as its /api Host. It runs model-generated commands: keep it
  behind the proxy with an access list, never publish its port. Sign in
  once via the ?token= URL in its logs. The image's own healthcheck
  expects 200 from `/`, which now needs that cookie, so this one accepts
  401 too. `home` holds profiles, API credentials and sessions.
