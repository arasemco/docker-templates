image: ghcr.io/arasemco/dsh
description: DeepSeek coding agent web UI
tag_default: latest

display:
  name: DeepSeek Harness

environment:
  DSH_PORT: "-port:3080"

volumes:
  home:
    path: /home/dsh/.dsh
    backup: true
    owner:
      uid: 1000
      gid: 1000
  ssh:
    path: /home/dsh/.ssh
    backup: true
    owner:
      uid: 1000
      gid: 1000
  config:
    path: /home/dsh/.config
    backup: true
    owner:
      uid: 1000
      gid: 1000
  docker:
    path: /home/dsh/.local/share/docker

cpu_default: "4"
mem_default: "8G"

labels:
  homepage.:
    icon: deepseek.svg
    description: "DeepSeek coding agent for ${COMPOSE_PROJECT_NAME}"
    ping: "http://127.0.0.1:3080/"
    href: "http://127.0.0.1:3080/"

extra:
  init: true
  runtime: runc
  security_opt:
    - seccomp:unconfined
    - systempaths=unconfined
  devices:
    - /dev/fuse
    - /dev/net/tun

header_comment: |
  DeepSeek Harness (dsh) — DeepSeek coding agent with a web UI and a
  rootless Docker daemon, built from ~/Projects/docker/deepseek-harness
  (`bash bake.sh`). dsh only binds 127.0.0.1, so a consumer runs it with
  `network_mode: host` to reach it at localhost:3080. security_opt and the
  fuse/tun devices are what the in-container dockerd needs.
  Backed up: `home` (profiles, API credentials, sessions), `ssh` and
  `config` (git identity/credentials, gh auth) — treat the archive as a
  secret. `docker` (image/build cache) is not backed up.
