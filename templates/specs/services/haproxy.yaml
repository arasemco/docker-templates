image: haproxy
tag_default: "3.2"

display:
  name: HAProxy

extra:
  profiles:
    - ""
    - haproxy
    - reverse-proxy
    - rev-proxy

cpu_default: "0.5"
mem_default: "256M"

labels:
  homepage.:
    description: "TCP passthrough load balancer"

header_comment: |
  HAProxy — TCP passthrough load balancer.
  haproxy.cfg and the reverse-proxy network (needs real IPAM/static IP)
  are deployment-specific — set both in the consuming docker-compose.yml.
