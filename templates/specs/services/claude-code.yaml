image: claude-code
tag_default: local

environment:
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

bind_mounts:
  - source: ${HOME}/.claude
    target: /home/claude/.claude
  - source: ${HOME}/.claude.json
    target: /home/claude/.claude.json

healthcheck:
  test: ["CMD", "claude", "--version"]
  interval: 30s
  timeout: 5s
  start_period: 10s

cpu_default: "8"
mem_default: "32G"

labels:
  homepage.:
    description: "Persistent Claude Code CLI sandbox"

extra:
  init: true
  stdin_open: true
  tty: true
  runtime: runc
  security_opt:
    - seccomp:unconfined
    - systempaths=unconfined
  devices:
    - /dev/fuse
    - /dev/net/tun
  command:
    - "This is your persistent Claude Code container. Remote Control is enabled, so stand by for a connection."
    - "--remote-control"

header_comment: |
  Claude Code — persistent, self-hosted Claude Code CLI sandbox (rootless
  Docker-in-Docker) that aram.semo drives from another device via Remote
  Control. Unlike every other spec in this repo, this is NOT a pulled,
  reverse-proxied homelab service: it's a locally BUILT, interactive
  personal dev container with no STACK_DOMAIN and nothing behind a proxy.

  BUILD, DON'T PULL: this image has no upstream to pull from. Before
  `docker compose up`, build it from the source repo:
    cd ~/Projects/docker/claude-code && docker compose build
  or, using its own bake file (also lets you push to REGISTRY, currently
  git.omesa.net/asemo, if ever published):
    cd ~/Projects/docker/claude-code && bash bake.sh [--push]

  This spec exists for documentation/consistency with the rest of the spec
  catalog, not to be regenerated: this generator has no `build:` concept
  and always emits a pulled `image:` line plus a
  `hostname: <name>.${STACK_DOMAIN:?...}.local` line and
  `restart: ${RESTART:-unless-stopped}` — none of which apply here. If this
  spec is ever run through the generator anyway, hand-correct or drop those
  lines afterward; the real source of truth is
  ~/Projects/docker/claude-code/docker-compose.yml. The fields under
  `extra:` (stdin_open/tty/init/restart/runtime/security_opt/devices/
  command) have no first-class schema field to live in otherwise.

  Bind mounts are host paths specific to aram.semo's as01 machine, not
  portable across hosts. No `secrets:`/`volumes:`/backup story: nothing
  here is meant to be backed up by this repo's backup/restore convention.
